# ==============================================================================
# TECHPULSE — Discover. Participate. Achieve.
# Course Code: 2113611 (Full Stack Java Programming)
# ==============================================================================

spring.application.name=TECHPULSE
server.port=${PORT:8080}

# Default Application Timezone (Asia/Kolkata - IST)
techpulse.timezone=Asia/Kolkata

# ==============================================================================
# Database Configuration (File-based H2 by default; survives server restarts)
# For future MySQL migration, override these via environment variables:
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/techpulse_db
#   SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
#   SPRING_DATASOURCE_USERNAME=root
#   SPRING_DATASOURCE_PASSWORD=your_password
#   SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/techpulse_db;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# H2 Console (for local database inspection during lab/viva demonstration)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session & Cookie Configuration
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Jackson JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# Development Demo Data Seeding
techpulse.demo.seed-enabled=${TECHPULSE_DEMO_SEED_ENABLED:true}

# Live Event Source Configuration (Environment Variables)
# Set TECHPULSE_LIVE_SOURCE_ENABLED=true and TECHPULSE_LIVE_SOURCE_URL to fetch live JSON feeds
techpulse.live-source.enabled=${TECHPULSE_LIVE_SOURCE_ENABLED:false}
techpulse.live-source.name=${TECHPULSE_LIVE_SOURCE_NAME:Public Tech Feed Adapter}
techpulse.live-source.url=${TECHPULSE_LIVE_SOURCE_URL:}
techpulse.live-source.api-key=${TECHPULSE_LIVE_SOURCE_API_KEY:}
techpulse.live-source.timeout-seconds=8
